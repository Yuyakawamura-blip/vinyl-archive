project_id = "vinyl-archive"

# analyze-record authenticates callers itself: a user session (RLS-checked) or
# the pg_cron worker secret. The worker call carries no JWT, so the gateway
# check must stay off.
[functions.analyze-record]
verify_jwt = false

# delete-account checks the caller's session itself (auth.getUser), like
# analyze-record, so it does not depend on the gateway's JWT check.
[functions.delete-account]
verify_jwt = false
